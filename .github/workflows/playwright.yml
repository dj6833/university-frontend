name: Playwright Tests
on:
  push:
    branches: [ staging ] # Test the staging environment after every push ('main' was proposed here also but I don't see why this would be necessary, my tests are designed to run on staging only, not on prod!?)
  pull_request:
    branches: [ staging ] # Test the proposed changes BEFORE they hit staging ('main' also removed as per above comment) - I also don't get this, as you raise a PR targeting Staging, but running tests at this point on staging won't reflect the proposed code change?! But will leave here for now...
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      env:
        # This line injects the GitHub secret into the environment
        VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
